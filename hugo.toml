baseURL = 'https://zariep.com'
locale = 'es-MX'
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

title = 'ItsZariep'
theme = 'Tessera'
enableSymlinks = true

[security]
  enableInlineShortcodes = true

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[mediaTypes]
  [mediaTypes."application/rss+xml"]
    suffixes = ["xml"]

[outputFormats]
  [outputFormats.RSS]
    mediaType = "application/rss+xml"
    baseName = "feed"
    isPlainText = true

[permalinks]
posts = "/:slug/"

[pagination]
  pagerSize = 9

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[params]
	author = "ItsZariep"
	description = 'Open source developer, independent, just for research, hobby and convenience'
	[[params.social_links]]
		name = "Ko-fi"
		url = "https://ko-fi.com/itszariep"
	[[params.social_links]]
		name = "LiberaPay"
		url = "https://liberapay.com/zariep"
