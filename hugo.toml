baseURL = 'https://zariep.com'
title = 'ItsZariep'
theme = 'Tessera'
enableSymlinks = true

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true
disableDefaultLanguageRedirect = true

[languages]
	[languages.en]
		label = "English"
		weight = 1
		contentDir = "content"
		[languages.en.params]
			description = 'Open source developer, independent, just for research, hobby and convenience'

	[languages.es]
		label = "Español"
		weight = 2
		contentDir = "content.es"
		[languages.es.params]
			description = 'Desarrollador de código abierto, independiente, solo para investigación, hobby y conveniencia'

	[languages.pt]
		label = "Português"
		weight = 3
		contentDir = "content.pt"
		[languages.pt.params]
			description = 'Desenvolvedor de código aberto, independente, apenas para pesquisa, hobby e conveniência'

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[mediaTypes]
  [mediaTypes."application/rss+xml"]
    suffixes = ["xml"]

[outputFormats]
  [outputFormats.RSS]
    mediaType = "application/rss+xml"
    baseName = "feed"
    isPlainText = true

[permalinks]
posts = "/:slug/"

[pagination]
  pagerSize = 9

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[params]
	author = "ItsZariep"
	[[params.social_links]]
		name = "Ko-fi"
		url = "https://ko-fi.com/itszariep"
	[[params.social_links]]
		name = "LiberaPay"
		url = "https://liberapay.com/zariep"
